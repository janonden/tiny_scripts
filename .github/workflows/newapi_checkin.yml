name: Newapi AI 自动签到
on:
#  schedule:
#    - cron: '0 1,3,7,11 * * *'
  workflow_dispatch:
    inputs:
      accounts:
        description: '账号配置 (JSON 格式，可选，不填则使用 secrets.ACCOUNTS)'
        required: false
        type: string
        default: ''
      providers:
        description: '自定义 Provider 配置 (JSON 格式，可选，不填则使用 secrets.PROVIDERS)'
        required: false
        type: string
        default: ''
      debug:
        description: '调试模式 (启用后会保存截图和 HTML 日志)'
        required: false
        type: boolean

jobs:
  checkin:
    permissions:
      id-token: write
      contents: read
    runs-on: windows-2025
    environment: acin_production
    defaults:
      run:
        working-directory: ./newapi-ai-check-in
    env:
      PYTHONIOENCODING: utf-8
    steps:
    - name: set beijing timezone
      uses: szenius/set-timezone@v2.0
      with:
        timezoneWindows: "China Standard Time"

    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 缓存 UV 依赖
      uses: actions/cache@v4
      id: uv-cache
      with:
        path: |
          ~/.cache/uv
          newapi-ai-check-in/.venv
        key: ${{ runner.os }}-uv-${{ hashFiles('newapi-ai-check-in/pyproject.toml', 'newapi-ai-check-in/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: 安装依赖
      if: steps.uv-cache.outputs.cache-hit != 'true'
      run: |
        echo "缓存未命中，开始安装项目依赖..."
        uv sync
        echo "✅ 环境初始化完成"

    - name: 获取 Camoufox 版本
      id: camoufox-version
      run: |
        $version = uv run python -c "import importlib.metadata; print(importlib.metadata.version('camoufox'))"
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "Camoufox version: $version"

    - name: 缓存 Camoufox 浏览器
      uses: actions/cache@v4
      id: camoufox-cache
      with:
        path: ~\AppData\Local\camoufox
        key: ${{ runner.os }}-camoufox-${{ steps.camoufox-version.outputs.version }}
        restore-keys: |
          ${{ runner.os }}-camoufox-

    - name: 安装 Camoufox 浏览器
      if: steps.camoufox-cache.outputs.cache-hit != 'true'
      run: |
        echo "缓存未命中，开始下载 Camoufox 浏览器..."
        uv run camoufox fetch
        echo "✅ Camoufox 浏览器安装完成"

    - name: 恢复登录状态缓存
      uses: actions/cache/restore@v4
      with:
        path: |
          newapi-ai-check-in/storage-states
        key: storage-state-${{ hashFiles('newapi-ai-check-in/storage-states/*.json') }}
        restore-keys: |
          storage-state-

    - name: 恢复余额历史缓存
      uses: actions/cache/restore@v4
      with:
        path: |
          newapi-ai-check-in/balance_hash.txt
        key: balance-hash-${{ hashFiles('newapi-ai-check-in/balance_hash.txt') }}
        restore-keys: |
          balance-hash-
            
    - name: 执行签到
      env:
        ACCOUNTS: ${{ inputs.accounts || secrets.ACIN_ANYROUTER_ACCOUNTS }}
        PROVIDERS: ${{ inputs.providers || secrets.ACIN_PROVIDERS }}
        ACCOUNTS_LINUX_DO: ${{ secrets.ACIN_ACCOUNTS_LINUX_DO }}
        NOTIFY_TYPE: ${{ secrets.FAU_NOTITY_TYPE }}
        NOTIFY_CONFIG: ${{ secrets.FAU_NOTITY_CONFIG }}
      run: |
        # 列出 storage-states 目录文件
        if (Test-Path "storage-states") {
          echo "📁 storage-states 目录内容:"
          echo "绝对路径: $(Resolve-Path storage-states)"
          echo ""
          echo "所有文件:"
          Get-ChildItem -Path storage-states -File | ForEach-Object { echo "  - $($_.Name)" }
          echo ""
          echo "详细信息:"
          Get-ChildItem -Path storage-states -File | Format-Table Name, Length, LastWriteTime -AutoSize
          echo "文件总数: $((Get-ChildItem -Path storage-states -File).Count)"
        } else {
          echo "⚠️ storage-states 目录不存在"
        }
        # 执行签到
        uv run python -u main.py

    - name: 保存登录状态缓存
      if: hashFiles('newapi-ai-check-in/storage-states/*.json') != ''
      uses: actions/cache/save@v4
      with:
        path: |
          newapi-ai-check-in/storage-states
        key: storage-state-${{ hashFiles('newapi-ai-check-in/storage-states/*.json') }}

    - name: 保存余额历史缓存
      if: hashFiles('newapi-ai-check-in/balance_hash.txt') != ''
      uses: actions/cache/save@v4
      with:
        path: |
          newapi-ai-check-in/balance_hash.txt
        key: balance-hash-${{ hashFiles('newapi-ai-check-in/balance_hash.txt') }}

    - name: 保存日志
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: artifacts-${{ github.run_number }}
        path: |
          newapi-ai-check-in/logs/
          newapi-ai-check-in/screenshots/
        if-no-files-found: ignore
        retention-days: 7

    - name: 执行结果
      if: always()
      run: |
        echo "签到任务执行完成"
        echo "时间: $(Get-Date)"
